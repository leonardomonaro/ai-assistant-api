spring.application.name=ai-assistant-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_assistant}}
spring.datasource.username=${POSTGRES_USER:ai_assistant}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-trailing-tokens=true
server.address=127.0.0.1

app.ai.provider=${AI_PROVIDER:mock}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT:5s}
app.ai.read-timeout=${AI_READ_TIMEOUT:30s}
app.ai.max-context-messages=${AI_MAX_CONTEXT_MESSAGES:20}
app.ai.max-completion-tokens=${AI_MAX_COMPLETION_TOKENS:512}
app.ai.system-prompt=${AI_SYSTEM_PROMPT:You are a helpful, concise and respectful virtual assistant.}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
